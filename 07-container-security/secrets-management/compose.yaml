name: docker-secrets-practice

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secure_database
      POSTGRES_USER: secure_user
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - private-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U secure_user -d secure_database
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

secrets:
  database_password:
    file: ./secrets/database-password.txt

volumes:
  database-data:

networks:
  private-network:
    driver: bridge

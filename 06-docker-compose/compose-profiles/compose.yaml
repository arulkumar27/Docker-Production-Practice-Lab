name: docker-compose-profiles

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profile_database
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_password
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - application-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U profile_user -d profile_database
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  adminer:
    image: adminer:5
    profiles:
      - tools
    depends_on:
      database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "8080:8080"
    networks:
      - application-network
    restart: unless-stopped

  debug:
    image: nicolaka/netshoot:latest
    profiles:
      - debug
    command:
      - sleep
      - infinity
    networks:
      - application-network
    security_opt:
      - no-new-privileges:true

volumes:
  database-data:

networks:
  application-network:
    driver: bridge

name: Docker CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "10-ci-cd-integration/sample-app/**"
      - ".github/workflows/docker-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "10-ci-cd-integration/sample-app/**"
      - ".github/workflows/docker-ci.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}/docker-ci-practice
  APPLICATION_DIRECTORY: 10-ci-cd-integration/sample-app
  TEST_CONTAINER: github-actions-docker-test
  TEST_PORT: "8085"

jobs:
  build-test-scan:
    name: Build, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${IMAGE_REPOSITORY}"
          test -f "${APPLICATION_DIRECTORY}/Dockerfile"
          test -f "${APPLICATION_DIRECTORY}/index.html"

      - name: Generate image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          image_tag="sha-${short_sha}"
          image_reference="${IMAGE_REPOSITORY}:${image_tag}"

          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APPLICATION_DIRECTORY }}
          file: ${{ env.APPLICATION_DIRECTORY }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.image_reference }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        shell: bash
        run: |
          set -euo pipefail

          docker image inspect \
            "${{ steps.metadata.outputs.image_reference }}"

          docker image history \
            "${{ steps.metadata.outputs.image_reference }}"

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name "${TEST_CONTAINER}" \
            --publish "127.0.0.1:${TEST_PORT}:80" \
            --memory="256m" \
            --cpus="0.50" \
            --pids-limit=100 \
            --security-opt=no-new-privileges:true \
            "${{ steps.metadata.outputs.image_reference }}"

          for attempt in {1..12}; do
            if curl --fail --silent \
              "http://127.0.0.1:${TEST_PORT}" \
              | grep --quiet "Docker CI/CD Practice"; then
              echo "Smoke test passed."
              exit 0
            fi

            echo "Waiting for application: attempt ${attempt}/12"
            sleep 5
          done

          echo "Smoke test failed."
          docker logs "${TEST_CONTAINER}"
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ steps.metadata.outputs.image_reference }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push versioned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          image_reference="${{ steps.metadata.outputs.image_reference }}"
          latest_reference="${IMAGE_REPOSITORY}:latest"

          docker push "$image_reference"
          docker tag "$image_reference" "$latest_reference"
          docker push "$latest_reference"

      - name: Display container logs on failure
        if: failure()
        shell: bash
        run: |
          docker logs "${TEST_CONTAINER}" 2>/dev/null || true
          docker ps -a

      - name: Remove test resources
        if: always()
        shell: bash
        run: |
          docker rm -f "${TEST_CONTAINER}" 2>/dev/null || true
          docker logout 2>/dev/null || true

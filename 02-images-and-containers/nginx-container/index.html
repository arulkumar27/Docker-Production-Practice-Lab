<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Nginx Practice</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
    }

    main {
      width: min(90%, 700px);
      padding: 40px;
      text-align: center;
      border: 1px solid #334155;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
    }

    p {
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      color: #052e16;
      background: #4ade80;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Docker Nginx Practice</h1>
    <p>
      This page is being served from an Nginx container.
    </p>
    <p>
      The local HTML file was copied into the container using
      <code>docker cp</code>.
    </p>
    <span class="status">Container is running</span>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arul Kumar | Docker Practice</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #020617;
      --surface: #0f172a;
      --border: #334155;
      --primary: #38bdf8;
      --secondary: #4ade80;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #172554, transparent 45%),
        var(--background);
    }

    main {
      width: min(100%, 760px);
      padding: 48px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    .label {
      color: var(--secondary);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0;
      color: var(--primary);
      font-size: clamp(2rem, 7vw, 4rem);
    }

    h2 {
      margin: 0;
      color: var(--text);
      font-weight: 500;
    }

    p {
      margin: 22px 0;
      color: var(--muted);
      line-height: 1.8;
    }

    ul {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0 0;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 9px 14px;
      color: #bae6fd;
      border: 1px solid #0ea5e9;
      border-radius: 999px;
      background: rgba(14, 165, 233, 0.1);
    }

    footer {
      margin-top: 32px;
      padding-top: 20px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <span class="label">Docker Production Practice Lab</span>
    <h1>Arul Kumar</h1>
    <h2>Aspiring Cloud and DevOps Engineer</h2>

    <p>
      This application is packaged inside a custom Docker image and served
      through an Nginx container.
    </p>

    <ul>
      <li>AWS</li>
      <li>Linux</li>
      <li>Docker</li>
      <li>Jenkins</li>
      <li>Kubernetes</li>
      <li>Terraform</li>
      <li>Ansible</li>
    </ul>

    <footer>
      Image: arul-docker-portfolio:1.0.0
    </footer>
  </main>
</body>
</html>

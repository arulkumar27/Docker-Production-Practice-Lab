name: docker-health-checks

services:
  healthy-web:
    image: nginx:1.27-alpine
    container_name: healthy-web
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  unhealthy-demo:
    image: alpine:3.21
    container_name: unhealthy-demo
    command:
      - /bin/sh
      - -c
      - while true; do sleep 3600; done
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://127.0.0.1:9999/ || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

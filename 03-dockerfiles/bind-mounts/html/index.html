<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Bind Mount Practice</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #020617;
      --surface: #0f172a;
      --border: #334155;
      --primary: #38bdf8;
      --success: #4ade80;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #172554, transparent 45%),
        var(--background);
    }

    main {
      width: min(100%, 700px);
      padding: 48px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-top: 0;
      color: var(--primary);
    }

    p {
      color: var(--muted);
      line-height: 1.7;
    }

    code {
      padding: 3px 7px;
      color: #bae6fd;
      background: #1e293b;
      border-radius: 5px;
    }

    .status {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      color: #052e16;
      background: var(--success);
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Docker Bind Mount</h1>

    <p>
      This HTML file is stored on the Docker host and mounted into an
      Nginx container.
    </p>

    <p>
      Modify <code>html/index.html</code> and refresh the browser to see
      the changes immediately.
    </p>

    <span class="status">Read-only bind mount active</span>
  </main>
</body>
</html>

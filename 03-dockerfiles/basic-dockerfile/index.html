<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dockerfile Fundamentals</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #e2e8f0;
      background: #020617;
    }

    main {
      width: min(85%, 650px);
      padding: 40px;
      text-align: center;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #0f172a;
    }

    h1 {
      color: #38bdf8;
    }

    .status {
      color: #4ade80;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Dockerfile Fundamentals</h1>
    <p>This page was added to an Nginx image using a Dockerfile.</p>
    <p class="status">Image build successful</p>
  </main>
</body>
</html>
